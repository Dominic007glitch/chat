<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Amigos</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- LOGIN -->

    <div id="login" class="login">

        <div class="login-box">

            <h1>💬 Chat Amigos</h1>

            <p>Entre para conversar.</p>

            <input
                id="nome"
                type="text"
                placeholder="Seu nome">

            <button id="entrar">
                Entrar
            </button>

        </div>

    </div>



    <!-- CHAT -->

    <div id="chat" class="app" style="display:none;">

        <!-- MENU LATERAL -->

        <aside class="sidebar">

            <h2>💬 Chat Amigos</h2>

            <div class="lista-salas">

                <button class="sala ativa" data-sala="geral">
                    📚 Sala Geral
                </button>

                <button class="sala" data-sala="privada" id="salaPrivada">
                    🔒 Sala Privada
                </button>

            </div>

            <div class="sidebar-footer">

                <button id="criarSala">
                    ➕ Criar Sala
                </button>

            </div>

        </aside>



        <!-- CHAT -->

        <main class="chat">

            <header class="topo-chat">

                <div>

                    <h2 id="tituloSala">
                        📚 Sala Geral
                    </h2>

                    <small id="usuario"></small>

                </div>

            </header>



            <div id="mensagens"></div>



            <div class="envio">

                <input
                    id="mensagem"
                    placeholder="Digite uma mensagem...">

                <button id="enviar">

                    Enviar

                </button>

            </div>

        </main>

    </div>





    <!-- SENHA DA SALA PRIVADA -->

    <div id="senhaSala" class="login" style="display:none;">

        <div class="login-box">

            <h2>🔒 Sala Privada</h2>

            <p>Digite a senha da sala.</p>

            <input
                id="senha"
                type="password"
                placeholder="Senha">

            <button id="entrarSala">

                Entrar

            </button>

            <p id="erroSenha"></p>

        </div>

    </div>



    <script type="module" src="script.js"></script>

</body>

</html>
