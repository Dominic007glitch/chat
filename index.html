<!DOCTYPE html>
<html lang="pt-BR">

<head>

<title>Chat Amigos</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="login" class="login">

<h2>Entrar no Chat</h2>

<input id="nome" placeholder="Seu nome">

<button id="entrar">
Entrar
</button>

</div>




<div class="app" id="chat" style="display:none;">


<aside class="sidebar">

<h2>N sei oq colocar</h2>

  <button id="salaPrivada">
🔒 Sala Privada
</button>


  <div id="senhaSala" style="display:none;">

<h2>Entrar na sala privada</h2>

<input id="senha" placeholder="Digite a senha">

<button id="entrarSala">
Entrar
</button>

</div>





</aside>




<main class="chat">


<header>

<h2>Chat Amigos</h2>

<span id="usuario"></span>

</header>




<div id="mensagens">

</div>




<div class="envio">

<input 
id="mensagem"
placeholder="Digite uma mensagem..."
>


<button id="enviar">
Enviar
</button>


</div>


</main>


</div>

</body>
