<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Amigos</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- LOGIN -->

<div id="login" class="login">

<h2>Entrar no Chat</h2>

<input id="nome" placeholder="Seu nome">

<button id="entrar">
Entrar
</button>

</div>



<!-- CHAT PRINCIPAL -->

<div class="app" id="chat" style="display:none;">


<aside class="sidebar">

<h2>Salas</h2>


<button id="salaPrivada">
🔒 Sala Privada
</button>


</aside>



<main class="chat">


<header>

<h2>Chat Amigos</h2>

<span id="usuario"></span>

</header>




<div id="mensagens">

</div>




<div class="envio">


<input 
id="mensagem"
placeholder="Digite uma mensagem..."
>


<button id="enviar">
Enviar
</button>


</div>


</main>


</div>





<!-- LOGIN DA SALA PRIVADA -->

<div id="senhaSala" class="login" style="display:none;">


<h2>Entrar na Sala Privada</h2>


<input 
id="senha" 
placeholder="Digite a senha"
>


<button id="entrarSala">
Entrar
</button>


<p id="erroSenha"></p>


</div>






<script type="module" src="script.js"></script>


</body>

</html>
